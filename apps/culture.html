<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Culture - SDV-OS X PRODEV ZLI</title><link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"><style>body{background:#05050a;color:#fff} .glass{background:rgba(18,18,26,0.85);border:1px solid rgba(255,255,255,0.08)}</style></head><body class="p-4"><div class="max-w-4xl mx-auto"><a href="/index.html" class="glass px-4 py-2 rounded-full text-xs">← SDV-OS X PRODEV ZLI</a><h1 class="text-2xl font-black mt-6">Zimbabwe Cultural Learning</h1><select id="tribe" onchange="loadTribe()" class="w-full mt-4 glass p-3 rounded-xl"><option value="shona">Shona</option><option value="ndebele">Ndebele</option><option value="tonga">Tonga</option><option value="venda">Venda</option><option value="kalanga">Kalanga</option></select><div id="out" class="mt-6 glass rounded-2xl p-6"></div></div><script>const tribes={shona:{name:"Shona",lang:"Mhoro = Hello, Maswera sei? = How are you?",food:"Sadza, Muriwo, Nyama",tradition:"Mbira, Totems (Mutupo) - Shumba, Moyo etc",proverb:"Chara chimwe hachitswanyi inda - Unity is power"},ndebele:{name:"Ndebele",lang:"Sawubona = Hello",food:"Isitshwala, Inyama",tradition:"Bright geometric house painting",proverb:"Inhlwa kayibanjwa ngasandla sinye"},tonga:{name:"Tonga",lang:"Mwapona",food:"Fish, Millet",tradition:"Nyaminyami god of Zambezi"},venda:{name:"Venda",lang:"Ndaa",food:"Tshidzimba",tradition:"Lake Fundudzi sacred"},kalanga:{name:"Kalanga",lang:"Dumilani = Hello",food:"Bogobe",tradition:"Mwali cult, Domba dance"}};function loadTribe(){const t=document.getElementById('tribe').value; const d=tribes[t]; document.getElementById('out').innerHTML=`<h2 class="font-black text-yellow-400 text-xl">${d.name}</h2><p class="mt-3 text-sm">Language: ${d.lang}</p><p class="text-sm">Food: ${d.food}</p><p class="text-sm">Tradition: ${d.tradition}</p><div class="mt-4 glass p-3 rounded-xl text-xs italic">"${d.proverb||''}"</div>`;}loadTribe();</script></body></html>
