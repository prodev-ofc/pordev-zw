<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Driving - SDV-OS X PRODEV ZLI</title><link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"><style>body{background:#05050a;color:#fff} .glass{background:rgba(18,18,26,0.85);border:1px solid rgba(255,255,255,0.08)} .btn-neon{background:linear-gradient(135deg,#00f5ff,#7a5cff)}</style></head><body class="p-4"><div class="max-w-4xl mx-auto"><a href="/index.html" class="glass px-4 py-2 rounded-full text-xs">← SDV-OS X PRODEV ZLI</a><h1 class="text-2xl font-black mt-6">Learn Driving</h1><select id="country" onchange="loadCountry()" class="w-full mt-4 glass p-3 rounded-xl"><option value="ZW">Zimbabwe - VID</option><option value="SA">South Africa - K53</option><option value="UK">UK - DVLA</option><option value="US">USA - DMV</option></select><div id="content" class="mt-6 glass rounded-2xl p-6"></div></div><script>const data={ZW:{title:"Zimbabwe VID",rules:["Keep left, overtake right","60 town, 120 highway","Stop 3 seconds at STOP","Give way to pedestrians"],quiz:[{q:"Give way at roundabout?",a:["Give way to right","Left","Stop"],c:0}]},SA:{title:"SA K53",rules:["Mirror-Signal-Blind spot","Defensive driving"],quiz:[]},UK:{title:"UK DVLA",rules:["Drive on left","70mph motorway"],quiz:[]},US:{title:"USA DMV",rules:["Drive on right","Right on red after stop"],quiz:[]}};function loadCountry(){const c=document.getElementById('country').value; const d=data[c]; document.getElementById('content').innerHTML=`<h2 class="font-black text-cyan-400">${d.title}</h2><ul class="mt-3 text-sm list-disc pl-5">${d.rules.map(r=>`<li>${r}</li>`).join('')}</ul><div class="mt-4">${d.quiz.map(q=>`<div class="glass p-3 rounded-xl mt-2 text-xs">${q.q}<div class="mt-2">${q.a.map((opt,j)=>`<button onclick="this.style.background='${j===q.c?'#00ff8844':'#ff444444'}'" class="block w-full text-left glass mt-1 p-2 rounded-lg">${opt}</button>`).join('')}</div></div>`).join('')}</div>`;}loadCountry();</script></body></html>
